name: Coverage
permissions:
  contents: read
on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0

      - name: Run tests with LLVM coverage (source-based, line + branch)
        run: |
          set -euo pipefail
          bazel coverage --lockfile_mode=error --config=llvm_cov --build_tests_only -- //src/...

      - name: Generate coverage report
        env:
          # Report-only at introduction; ratchet once a baseline is agreed.
          COVERAGE_THRESHOLD: "0"
        run: |
          set -euo pipefail
          bazel run --lockfile_mode=error @score_tooling//coverage:generate_coverage_html -- \
            --yaml tools/coverage/coverage_justifications.yaml \
            --testlogs-subdir src \
            --archive-dir coverage_artifact

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage_artifact/
